name: quality-inspection-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qi
      POSTGRES_USER: qi
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - target: 5432
        published: 0
        host_ip: 127.0.0.1
        protocol: tcp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qi -d qi"]
      interval: 2s
      timeout: 2s
      retries: 30
