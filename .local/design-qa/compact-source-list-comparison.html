<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Compact inspection list comparison</title>
    <style>
      body {
        margin: 0;
        background: #eef2f6;
        color: #17233b;
        font: 14px/1.4 sans-serif;
      }

      main {
        display: flex;
        align-items: flex-start;
        gap: 24px;
        padding: 24px;
      }

      figure {
        margin: 0;
      }

      figcaption {
        margin-bottom: 8px;
        font-weight: 700;
      }

      img {
        display: block;
        width: 183px;
        height: 614px;
        border: 1px solid #cbd5e1;
        background: #ffffff;
        object-fit: cover;
        object-position: top;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>参考</figcaption>
        <img src="compact-source-list-reference.png" alt="参考紧凑检验项列表">
      </figure>
      <figure>
        <figcaption>修复后</figcaption>
        <img src="compact-source-list-fixed.png" alt="修复后的紧凑检验项列表">
      </figure>
    </main>
  </body>
</html>
