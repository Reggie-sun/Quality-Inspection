<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Technical Requirement A Flow Comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #eef2f6;
      color: #101828;
      font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
    }
    h1 { margin: 0 0 18px; font-size: 20px; }
    h2 { margin: 0 0 10px; font-size: 14px; }
    .comparison {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }
    .frame {
      padding: 14px;
      border: 1px solid #d0d9e4;
      border-radius: 10px;
      background: #fff;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #edf1f5;
    }
  </style>
</head>
<body>
  <h1>A 内联逐条确认 · 同状态对照</h1>
  <div class="comparison">
    <section class="frame">
      <h2>Source · 已选择，待提交</h2>
      <img src="./technical-requirement-a-flow/source-selected.png" alt="">
    </section>
    <section class="frame">
      <h2>Implementation · 已选择，待提交</h2>
      <img src="./technical-requirement-a-flow/implementation-selected.png" alt="">
    </section>
  </div>
  <div class="comparison">
    <section class="frame">
      <h2>Source · 终态</h2>
      <img src="./technical-requirement-a-flow/source-terminal.png" alt="">
    </section>
    <section class="frame">
      <h2>Implementation · 终态</h2>
      <img src="./technical-requirement-a-flow/implementation-terminal.png" alt="">
    </section>
  </div>
</body>
</html>
