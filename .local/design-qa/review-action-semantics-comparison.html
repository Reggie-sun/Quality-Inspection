<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Action Semantics Comparison</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f4f7fb;
      color: #1f2937;
      font-family: system-ui, sans-serif;
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .subtitle { margin: 0 0 20px; color: #667085; }
    .comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }
    .evidence {
      padding: 14px;
      border: 1px solid #d8e1ee;
      border-radius: 12px;
      background: #fff;
    }
    .evidence h2 { margin: 0 0 6px; font-size: 18px; }
    .evidence p { margin: 0 0 12px; color: #64748b; font-size: 13px; }
    .evidence img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #d8e1ee;
      border-radius: 8px;
    }
    .focused { margin-top: 20px; max-width: 800px; }
  </style>
</head>
<body>
  <h1>方案 A：设计目标与真实实现对比</h1>
  <p class="subtitle">同一比较画面内检查分组、常驻说明、危险操作确认和窄屏可读性。</p>
  <div class="comparison">
    <section class="evidence">
      <h2>Source visual target</h2>
      <p>用户选择的方案 A 概念稿。</p>
      <img src="review-action-semantics-source-options.png" alt="方案 A 概念稿">
    </section>
    <section class="evidence">
      <h2>Rendered implementation</h2>
      <p>真实 workbench 中打开“排除”确认后的宽屏状态。</p>
      <img src="review-action-semantics-confirmation.png" alt="真实 workbench 排除确认状态">
    </section>
  </div>
  <section class="evidence focused">
    <h2>Responsive focused evidence</h2>
    <p>800px 窗口中的操作栏分组与常驻说明。</p>
    <img src="review-action-semantics-narrow-actions.png" alt="窄屏操作栏">
  </section>
</body>
</html>
