services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qi
      POSTGRES_USER: qi
      POSTGRES_PASSWORD: qi
    volumes:
      - qi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qi -d qi"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      QI_STORAGE_ROOT: /data
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - qi_storage:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      QI_STORAGE_ROOT: /data
    volumes:
      - ./backend:/app
      - qi_storage:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  qi_postgres:
    name: "${COMPOSE_PROJECT_NAME}_postgres_dev"
  qi_storage:
    name: "${COMPOSE_PROJECT_NAME}_storage_dev"
